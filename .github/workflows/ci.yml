name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/swipl:9.2.9@sha256:3e4b85b16f1e269c8a3ce3d968c843aa4cd858f7ace2db49398ec9a2b113bf0f
    steps:
      - name: Install job tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify SWI-Prolog version
        run: |
          set -eu
          out=$(swipl --version)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq "SWI-Prolog version 9.2.9 "

      - name: Verify SWI-Prolog crypto SHA-256
        run: |
          set -eu
          swipl -q -f none -F none \
            -g "use_module(library(crypto),[crypto_data_hash/3]),crypto_data_hash([0,1,2,127,128,255],Hash,[algorithm(sha256),encoding(octet)]),(Hash=='da2cb6ad175bc966de5e79c6e16777f8a98b610c2424a894132df2815be50677'->halt(0);halt(1))" \
            -t 'halt(9)'

      - name: Verify regeneration bootstrap identity
        run: |
          set -eu
          PYTHONPATH=vendor/e--/src PYTHONDONTWRITEBYTECODE=1 python3 -P -m e_minus_minus.strict tools/regen.emm >"$RUNNER_TEMP/regen.py.out"
          cmp "$RUNNER_TEMP/regen.py.out" tools/regen.py

      - name: Check generated Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -P tools/regen.py --check

      - name: Run goal check
        run: PYTHONDONTWRITEBYTECODE=1 python3 -P tools/goal.py check

      - name: Verify repository cleanliness
        run: |
          set -eu
          git diff --exit-code
          test -z "$(git status --porcelain)"

  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pinned Verus release
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="verus_asset_url"{print $2}' rust/verus.lock)
          asset=$(awk -F'\t' '$1=="verus_asset"{print $2}' rust/verus.lock)
          sha=$(awk -F'\t' '$1=="verus_asset_sha256"{print $2}' rust/verus.lock)
          curl -sSL -o "$RUNNER_TEMP/$asset" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/$asset" | sha256sum -c
          unzip -q "$RUNNER_TEMP/$asset" -d "$RUNNER_TEMP/verus"

      - name: Install pinned rust toolchain
        run: |
          set -eu
          tc=$(awk -F'\t' '$1=="rustc_toolchain"{print $2}' rust/verus.lock)
          rustup toolchain install "$tc" --profile minimal

      - name: Verify workspace
        run: |
          set -eu
          export PATH="$RUNNER_TEMP/verus/verus-x86-linux:$PATH"
          cd rust
          cargo verus verify --workspace --locked --offline -- --no-cheating

      - name: Build ckc
        run: |
          set -eu
          cd rust
          cargo build --release --locked --offline

      - name: Trust audit
        run: |
          set -eu
          cd rust
          ./target/release/ckc trust-audit
