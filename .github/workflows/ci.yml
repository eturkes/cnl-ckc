name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly advisories against the committed lock

permissions:
  contents: read

jobs:
  # Legacy chain (E-- → Python identity + corpus check); CI-authoritative until M5.7.
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/swipl:9.2.9@sha256:3e4b85b16f1e269c8a3ce3d968c843aa4cd858f7ace2db49398ec9a2b113bf0f
    steps:
      - name: Install job tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify SWI-Prolog version
        run: |
          set -eu
          out=$(swipl --version)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq "SWI-Prolog version 9.2.9 "

      - name: Verify SWI-Prolog crypto SHA-256
        run: |
          set -eu
          swipl -q -f none -F none \
            -g "use_module(library(crypto),[crypto_data_hash/3]),crypto_data_hash([0,1,2,127,128,255],Hash,[algorithm(sha256),encoding(octet)]),(Hash=='da2cb6ad175bc966de5e79c6e16777f8a98b610c2424a894132df2815be50677'->halt(0);halt(1))" \
            -t 'halt(9)'

      - name: Verify regeneration bootstrap identity
        run: |
          set -eu
          PYTHONPATH=vendor/e--/src PYTHONDONTWRITEBYTECODE=1 python3 -P -m e_minus_minus.strict tools/regen.emm >"$RUNNER_TEMP/regen.py.out"
          cmp "$RUNNER_TEMP/regen.py.out" tools/regen.py

      - name: Check generated Python
        run: PYTHONDONTWRITEBYTECODE=1 python3 -P tools/regen.py --check

      - name: Run goal check
        run: PYTHONDONTWRITEBYTECODE=1 python3 -P tools/goal.py check

      - name: Verify repository cleanliness
        run: |
          set -eu
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Rust chain = `just rust`: verusfmt, clippy -D warnings, Verus --no-cheating,
  # build, trust-audit, tests, cargo-deny, gitleaks. Tools + toolchain come from
  # the sha256-pinned locks (rust/verus.lock, rust/tools.lock) via `just tools`.
  rust:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain
            !.toolchain/dl
          key: toolchain-${{ runner.os }}-${{ hashFiles('rust/verus.lock', 'rust/tools.lock', 'rust/rust-toolchain.toml') }}

      - name: Install pinned tools
        run: just tools

      - name: Rust gate
        run: just rust

  # Weekly: RustSec advisories + license/source policy over the committed Cargo.lock.
  advisories:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain
            !.toolchain/dl
          key: toolchain-${{ runner.os }}-${{ hashFiles('rust/verus.lock', 'rust/tools.lock', 'rust/rust-toolchain.toml') }}

      - name: Install pinned tools
        run: just tools

      - name: Dependency audit
        run: just deny
