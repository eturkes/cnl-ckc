name: ci

on:
  push:
    branches: [main, "ci/**"] # ci/<unit> = the CI gate (.claude/rules/ops.md)
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly: advisories, Kani, pin drift, online workflow audit

permissions:
  contents: read

# One run per ref at a time: a re-pushed ci/<unit> supersedes its earlier run, while main
# and pull-request runs queue, so every pushed main commit keeps its own gate record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/ci/') }}

jobs:
  # Rust chain = `just rust`: verusfmt, clippy -D warnings, Verus --no-cheating,
  # build, trust-audit, tests, cargo-deny, gitleaks, zizmor; then the phone-layout
  # check (`just mobile`: the pinned headless Chrome, whose libraries the runner image
  # carries). Tools + toolchain come from the sha256-pinned locks (rust/verus.lock,
  # rust/tools.lock) via `just tools`; the SWI-backed test harnesses use the pinned
  # SWI-Prolog source build of `just swipl`, cached on its pin. The container jobs run
  # its static musl binary (`just build-static`).
  rust:
    name: rust
    if: github.event_name != 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain
            !.toolchain/dl
            !.toolchain/swipl-*
          key: toolchain-${{ runner.os }}-${{ hashFiles('rust/verus.lock', 'rust/tools.lock', 'rust/rust-toolchain.toml') }}

      - name: Install pinned tools
        run: just tools

      # Key = the runner's OS release (the build links its system libraries; runner.os
      # reads Linux on every image) + the swipl recipe's version + source sha256.
      - name: Read SWI-Prolog pin
        id: swipl-pin
        run: |
          set -eu
          pin=$(grep -oE 'v=[0-9.]+; sha=[0-9a-f]{64}' justfile | head -n 1)
          [ -n "$pin" ]
          v=${pin#v=}; v=${v%%;*}
          . /etc/os-release
          echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "sha=${pin##*sha=}" >> "$GITHUB_OUTPUT"

      - name: Cache SWI-Prolog
        id: swipl-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .toolchain/swipl-${{ steps.swipl-pin.outputs.version }}
          key: swipl-${{ steps.swipl-pin.outputs.os }}-${{ steps.swipl-pin.outputs.version }}-${{ steps.swipl-pin.outputs.sha }}

      - name: Install SWI-Prolog build dependencies
        if: steps.swipl-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-dev libdb-dev libedit-dev \
            libgmp-dev libossp-uuid-dev libpcre2-dev libssl-dev libyaml-dev libncurses-dev \
            zlib1g-dev

      - name: Install SWI-Prolog (just swipl)
        run: just swipl

      - name: Rust gate
        run: just rust

      - name: Phone layout
        run: just mobile

      - name: Build static ckc
        run: just build-static

      - name: Upload ckc binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ckc
          path: rust/target/x86_64-unknown-linux-musl/release/ckc
          retention-days: 1

  # Corpus chain = `just check` over the rust job's static binary inside the pinned
  # swipl container (the reference runtime): spec-lint, ckc check, ckc ui check, fresh
  # compile + queries byte-stable. Full history: fork-notice dates + ledger commits
  # read git log.
  check:
    name: check
    if: github.event_name != 'schedule'
    needs: rust
    runs-on: ubuntu-26.04
    container:
      image: docker.io/library/swipl:10.0.2@sha256:83f308504932364dd1b0a33d927f69ce0df35dfcdaf377308166f8cc41425913
    steps:
      # procps = /bin/kill: `ckc check` kills a timed-out subprocess group with it
      # (its wall-clock probe always does); the image ships no kill binary.
      - name: Install job tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl procps

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify SWI-Prolog version
        run: |
          set -eu
          out=$(swipl --version)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -Fq "SWI-Prolog version 10.0.2 "

      - name: Verify SWI-Prolog crypto SHA-256
        run: |
          set -eu
          swipl -q -f none -F none \
            -g "use_module(library(crypto),[crypto_data_hash/3]),crypto_data_hash([0,1,2,127,128,255],Hash,[algorithm(sha256),encoding(octet)]),(Hash=='da2cb6ad175bc966de5e79c6e16777f8a98b610c2424a894132df2815be50677'->halt(0);halt(1))" \
            -t 'halt(9)'

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Download ckc binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ckc
          path: ${{ runner.temp }}/ckc-bin

      - name: Corpus chain
        run: |
          chmod +x "$RUNNER_TEMP/ckc-bin/ckc"
          CKC_BIN="$RUNNER_TEMP/ckc-bin/ckc" just check

      - name: Verify repository cleanliness
        run: |
          set -eu
          git diff --exit-code
          test -z "$(git status --porcelain)"

  # Emission certification (M6, R83) = `just certify` over the rust job's static
  # binary inside the pinned swipl container (the reference runtime): the swipl image
  # carries no linker, so the artifact is the seam.
  certify:
    name: certify
    if: github.event_name != 'schedule'
    needs: rust
    runs-on: ubuntu-26.04
    container:
      image: docker.io/library/swipl:10.0.2@sha256:83f308504932364dd1b0a33d927f69ce0df35dfcdaf377308166f8cc41425913
    steps:
      - name: Install job tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Download ckc binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ckc
          path: ${{ runner.temp }}/ckc-bin

      - name: Certify
        run: |
          chmod +x "$RUNNER_TEMP/ckc-bin/ckc"
          CKC_BIN="$RUNNER_TEMP/ckc-bin/ckc" just certify

  # Weekly: RustSec advisories + license/source policy over the committed Cargo.lock.
  advisories:
    name: advisories
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain
            !.toolchain/dl
          key: toolchain-${{ runner.os }}-${{ hashFiles('rust/verus.lock', 'rust/tools.lock', 'rust/rust-toolchain.toml') }}

      - name: Install pinned tools
        run: just tools

      - name: Dependency audit
        run: just deny

  # Weekly: Kani bounded model checking over the kernel's public exec surface.
  kani:
    name: kani
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain
            !.toolchain/dl
          key: kani-${{ runner.os }}-${{ hashFiles('rust/kani.lock', 'rust/verus.lock', 'rust/tools.lock', 'rust/rust-toolchain.toml') }}

      - name: Install pinned tools
        run: just tools

      - name: Kani gate
        run: just kani

  # Weekly: online workflow audits (zizmor with a token) + pin drift (`just outdated`:
  # every lock pin vs upstream latest; red = bump notice, procedure in .claude/rules/rust.md).
  updates:
    name: updates
    if: github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bootstrap just (rust/tools.lock)
        run: |
          set -eu
          url=$(awk -F'\t' '$1=="just"{print $5}' rust/tools.lock)
          sha=$(awk -F'\t' '$1=="just"{print $4}' rust/tools.lock)
          curl -sSL -o "$RUNNER_TEMP/just.tar.gz" "$url"
          printf '%s  %s\n' "$sha" "$RUNNER_TEMP/just.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/just"
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP/just" just
          echo "$RUNNER_TEMP/just" >> "$GITHUB_PATH"

      - name: Cache toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .toolchain
            !.toolchain/dl
          key: toolchain-${{ runner.os }}-${{ hashFiles('rust/verus.lock', 'rust/tools.lock', 'rust/rust-toolchain.toml') }}

      - name: Install pinned tools
        run: just tools

      - name: Workflow audit (online)
        env:
          GH_TOKEN: ${{ github.token }}
        run: just workflows

      - name: Pin drift
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: just outdated
