[package]
name = "ckc"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
publish = false

[dependencies]
ckc-kernel = { path = "../ckc-kernel" }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = { version = "=0.11.1", default-features = false }

# Property harness (contract tf; rust/ckc/tests/support/prop.rs): `std` keeps panic capture during
# shrinking; fork, timeout + bit-set stay off.
[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
