# cargo-deny 0.20.2 policy (gate `just deny`; CI weekly `advisories` job).
# Graph = the vendored, --locked closure; deps-allowlist.tsv + trust-audit
# already pin the package SET, so this file owns licenses + advisories + sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
allow = ["Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
