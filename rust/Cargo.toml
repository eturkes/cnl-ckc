# cnl-ckc Rust workspace (M5): ckc-spec = trusted spec surface; ckc-kernel =
# verified impl+proofs (uninspected; `cargo verus verify` = its whole review);
# ckc = thin unverified shell. Gate: cargo verus verify --workspace --locked
# --offline + `ckc trust-audit` (escape/dep/manifest audit). Toolchain pin =
# verus.lock + rust-toolchain.toml.
[workspace]
resolver = "2"
members = ["ckc-spec", "ckc-kernel", "ckc"]

[workspace.dependencies]
vstd = "=0.0.0-2026-08-30-0159"

# vstd's macros expand to cfg(verus_keep_ghost)-family gates; declared so
# unexpected_cfgs stays quiet for them and live for anything else.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)", "cfg(verus_verify_core)"] }

# `cargo test` replays K2/K3 limit cases (tests/v1: 5000-deep proofs, 10^5-step
# budgets) through the kernel: unoptimized, three of them take 56–121 s each,
# optimized 10–19 s. Debug assertions + overflow checks keep their dev defaults.
[profile.dev.package.ckc-kernel]
opt-level = 3
