# Trivy ignore list for `just image-scan` (spec Decisions Deps: CI image CVEs).
# Scope: the pinned CI container docker.io/library/swipl:10.0.2 in .github/workflows/ci.yml.
# It runs the check + certify CI jobs over the checkout alone; nothing ships from it.
# Each entry = one HIGH/CRITICAL CVE with a fixed Debian version that the pinned image lacks.
# expired_at = 30 days after the entry was added: Trivy drops an expired entry, so the weekly
# scan fails again and the entry needs a new decision (re-pin a rebuilt image, or renew).
vulnerabilities:
  - id: CVE-2026-111497
    purls:
      - pkg:deb/debian/libbrotli1
    statement: brotli decoder out-of-bounds write; fixed in libbrotli1 1.0.9-2+deb12u1; CI-only container, nothing ships from it
    expired_at: 2026-11-27
  - id: CVE-2025-59375
    purls:
      - pkg:deb/debian/libexpat1
    statement: expat large allocations from a small document; fixed in libexpat1 2.5.0-1+deb12u5; CI-only container, nothing ships from it
    expired_at: 2026-11-27
  - id: CVE-2026-77214
    purls:
      - pkg:deb/debian/libexpat1
    statement: expat heap buffer over-read in XML_ParseBuffer; fixed in libexpat1 2.5.0-1+deb12u5; CI-only container, nothing ships from it
    expired_at: 2026-11-27
  - id: CVE-2026-84782
    purls:
      - pkg:deb/debian/libssl3
      - pkg:deb/debian/openssl
    statement: openssl information disclosure via DTLS handshake retransmission; fixed in libssl3 + openssl 3.0.22-1~deb12u2; CI-only container, nothing ships from it
    expired_at: 2026-11-27
